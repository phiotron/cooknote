<!-- MẪU TỔNG HỢP: tự viết, ảnh ở nhiều dạng (ImageObject, đường dẫn tương đối, //, trùng, data:) cộng og:image. -->
<html>
<head><title>Image Cases</title>
<meta property="og:image" content="/media/hero.jpg">
<meta property="og:image" content="https://cdn.example.test/extra.jpg">
<script type="application/ld+json">
{"@type":"Recipe","name":"Image Cases",
 "image":[
   {"@type":"ImageObject","url":"/media/hero.jpg"},
   "//cdn.example.test/a.jpg",
   "media/relative.jpg",
   "data:image/png;base64,AAAA",
   "https://cdn.example.test/a.jpg",
   ""
 ],
 "recipeIngredient":["x"],"recipeInstructions":["y"]}
</script>
</head><body></body></html>
