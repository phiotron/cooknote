<body>
<article itemscope itemtype="https://schema.org/Recipe">
  <h1 itemprop="name">Bánh flan caramel &#8211; mềm mịn</h1>
  <p>Cho <span itemprop="recipeYield">3-4 phần ăn</span></p>
  <meta itemprop="totalTime" content="PT2H">
  <h2>Nguyên liệu</h2>
  <p itemprop="recipeIngredient">3 quả trứng gà</p>
  <p itemprop="recipeIngredient">300ml sữa tươi</p>
  <p itemprop="recipeIngredient">50g đường làm caramel</p>
  <h2>Cách làm</h2>
  <p itemprop="recipeInstructions">Làm caramel rồi đổ vào khuôn.</p>
  <p itemprop="recipeInstructions">Trộn trứng với sữa, lọc qua rây, đổ vào khuôn.</p>
  <p itemprop="recipeInstructions">Hấp cách thủy 25 phút, để nguội rồi cho vào tủ lạnh.</p>
  <p>Nhà m&igrave;nh hay l&agrave;m m&oacute;n n&agrave;y v&agrave;o cuối tuần.</p>
