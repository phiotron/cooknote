.dark .fab{box-shadow:none}
/* fields */
.field{min-height:56px;border-radius:12px;background:var(--surfaceContainerLowest);box-shadow:inset 0 0 0 1px var(--outline);padding:8px 14px;display:flex;flex-direction:column;justify-content:center}
.field .lab{font-size:calc(var(--ts)*12px);color:var(--onSurfaceVariant);font-weight:600}
.field .val{font-size:calc(var(--ts)*16px);line-height:1.45}
.field.err{box-shadow:inset 0 0 0 2px var(--error)}
.field.focus{box-shadow:inset 0 0 0 2px var(--primary)}
.search{display:flex;align-items:center;gap:10px;height:52px;border-radius:26px;background:var(--surfaceContainerHigh);padding:0 6px 0 16px;color:var(--onSurfaceVariant);font-size:calc(var(--ts)*16px)}
.help{font-size:calc(var(--ts)*12.5px);color:var(--onSurfaceVariant);line-height:1.4}
.errt{font-size:calc(var(--ts)*12.5px);color:var(--error);display:flex;gap:4px;align-items:center;font-weight:600}
/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:5px 12px;border-radius:9px;box-shadow:inset 0 0 0 1px var(--outline);color:var(--onSurfaceVariant);font-size:calc(var(--ts)*13.5px);font-weight:600;line-height:1.3;background:transparent;white-space:nowrap}
.chip.sel{background:var(--secondaryContainer);color:var(--onSecondaryContainer);box-shadow:none}
.chip.pri{background:var(--primaryContainer);color:var(--onPrimaryContainer);box-shadow:none}
.chip.soft{background:var(--surfaceContainerHigh);box-shadow:none;color:var(--onSurface)}
.chip .x{margin-right:-6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow:hidden}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:calc(var(--ts)*12px);font-weight:600;line-height:1.4}
.tag.ok{background:var(--successContainer);color:var(--onSuccessContainer)}
.tag.warn{background:var(--warningContainer);color:var(--onWarningContainer)}
.tag.bad{background:var(--errorContainer);color:var(--onErrorContainer)}
.tag.info{background:var(--infoContainer);color:var(--onInfoContainer)}
.tag.neutral{background:var(--surfaceContainerHigh);color:var(--onSurfaceVariant)}
.tag.sug{background:var(--suggestedContainer);color:var(--suggested);box-shadow:inset 0 0 0 1px var(--suggested)}
/* segmented */
.seg{display:flex;border-radius:24px;box-shadow:inset 0 0 0 1px var(--outline);overflow:hidden;min-height:48px}
.seg>span{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 10px;font-size:calc(var(--ts)*13.5px);font-weight:600;color:var(--onSurface);text-align:center;line-height:1.25}
.seg>span+span{box-shadow:inset 1px 0 0 var(--outline)}
.seg>span.on{background:var(--secondaryContainer);color:var(--onSecondaryContainer)}
.tsbig .seg{flex-direction:column;border-radius:16px}.tsbig .seg>span+span{box-shadow:inset 0 1px 0 var(--outline)}
/* switch */
.sw{width:52px;height:32px;border-radius:16px;box-shadow:inset 0 0 0 2px var(--outline);background:var(--surfaceContainerHighest);position:relative;flex:none}
.sw::after{content:'';position:absolute;left:8px;top:8px;width:16px;height:16px;border-radius:8px;background:var(--outline)}
.sw.on{background:var(--primary);box-shadow:none}.sw.on::after{left:24px;top:4px;width:24px;height:24px;border-radius:12px;background:var(--onPrimary)}
/* checkbox */
.cb{width:24px;height:24px;border-radius:6px;box-shadow:inset 0 0 0 2px var(--onSurfaceVariant);flex:none;display:flex;align-items:center;justify-content:center;color:var(--onPrimary)}
.cb.on{background:var(--primary);box-shadow:none}
.cb.big{width:30px;height:30px;border-radius:8px}
.radio{width:22px;height:22px;border-radius:11px;box-shadow:inset 0 0 0 2px var(--onSurfaceVariant);flex:none}
.radio.on{box-shadow:inset 0 0 0 2px var(--primary),inset 0 0 0 6px var(--surface),inset 0 0 0 12px var(--primary)}
/* lists */
.li{display:flex;align-items:center;gap:14px;min-height:56px;padding:8px 16px}
.li .lt{flex:1;min-width:0}
.li .ttl{font-size:calc(var(--ts)*16px);line-height:1.4}
.li .sub{font-size:calc(var(--ts)*13.5px);line-height:1.4;color:var(--onSurfaceVariant)}
.li>.ic{color:var(--onSurfaceVariant)}
.rule{border-bottom:1px solid var(--outlineVariant)}
.divider{height:1px;background:var(--outlineVariant);margin:4px 0}
.group{margin:8px 16px;border-radius:16px;background:var(--surfaceContainerLowest);box-shadow:inset 0 0 0 1px var(--outlineVariant);overflow:hidden}
.dark .group{background:var(--surfaceContainerLow)}
.group .li+.li{box-shadow:inset 0 1px 0 var(--outlineVariant)}
.gl{padding:18px 32px 6px;font-size:calc(var(--ts)*13px);font-weight:700;color:var(--primary);letter-spacing:.3px}
/* notebook-tab section header */
.tabh{display:flex;align-items:flex-end;gap:8px;border-bottom:1.5px solid var(--outline);margin:14px 16px 4px}
.tabh .tb{background:var(--surfaceContainerHigh);border-radius:9px 9px 0 0;padding:5px 12px 4px;font-family:var(--serif);font-weight:600;font-size:calc(var(--ts)*15px);line-height:1.35;color:var(--onSurface);box-shadow:inset 1px 1px 0 var(--outlineVariant),inset -1px 0 0 var(--outlineVariant)}
.tabh .cnt{margin-left:auto;padding-bottom:4px;font-size:calc(var(--ts)*12.5px);color:var(--onSurfaceVariant);font-weight:600}
.sech{display:flex;align-items:center;gap:8px;padding:20px 16px 6px}
.sech h2{margin:0;flex:1}
/* cards */
.card{border-radius:14px;background:var(--surfaceContainerLowest);box-shadow:inset 0 0 0 1px var(--outlineVariant);overflow:hidden;position:relative}
.dark .card{background:var(--surfaceContainerLow)}
.photo{display:block;width:100%;height:100%}
.ph{position:relative;overflow:hidden;background:var(--surfaceContainerHigh)}
.ribbon{position:absolute;top:0;right:12px;width:20px;height:30px;background:var(--ribbon);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);display:flex;justify-content:center;padding-top:5px;color:#fff}
.place{position:absolute;inset:0;background-image:repeating-linear-gradient(to bottom,transparent 0 17px,rgba(60,40,20,.13) 17px 18px);display:flex;align-items:center;justify-content:center;flex-direction:column}
.dark .place{background-image:repeating-linear-gradient(to bottom,transparent 0 17px,rgba(255,240,220,.08) 17px 18px)}
.place::before{content:'';position:absolute;top:0;bottom:0;left:18px;width:1.5px;background:rgba(176,38,27,.35)}
.place .ini{font-family:var(--serif);font-weight:600;color:var(--onPhotoPlaceholder);line-height:1}
.place .cat{font-size:11.5px;font-weight:700;color:var(--onPhotoPlaceholder);letter-spacing:.5px;margin-top:4px;opacity:.9}
.stars{display:inline-flex;gap:1px;color:var(--tertiary)}
.stars .off{color:var(--outline)}
.meta{display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap;font-size:calc(var(--ts)*12.5px);color:var(--onSurfaceVariant);line-height:1.35}
.meta>span{display:inline-flex;align-items:center;gap:3px}
/* bottom nav */
.nav{flex:none;display:flex;background:var(--surfaceContainer);padding:10px 0 12px;box-shadow:inset 0 1px 0 var(--outlineVariant)}
.nav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--onSurfaceVariant);text-decoration:none}
.nav .pill{width:60px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.nav a.on .pill{background:var(--primaryContainer);color:var(--onPrimaryContainer)}
.nav a.on{color:var(--onSurface)}
.nav .nl{font-size:calc(min(var(--ts),1.3)*12.5px);font-weight:600;line-height:1.25;max-width:100%;padding:0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav a.on .nl{font-weight:700}
/* overlays */
.scrim{position:absolute;inset:0;background:rgba(15,8,2,.42);z-index:8}
.dark .scrim{background:rgba(0,0,0,.6)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;background:var(--surfaceContainerLow);border-radius:28px 28px 0 0;display:flex;flex-direction:column;max-height:92%;overflow:hidden}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--outline);margin:12px auto 6px;flex:none}
.sheet .shd{padding:6px 20px 10px;display:flex;align-items:center;gap:8px}
.sheet .sbody{overflow:hidden;flex:1;min-height:0}
.sheet .sfoot{flex:none;display:flex;gap:10px;align-items:center;padding:12px 16px;box-shadow:inset 0 1px 0 var(--outlineVariant);background:var(--surfaceContainerLow)}
.dialog{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);z-index:9;background:var(--surfaceContainerHigh);border-radius:28px;padding:24px 24px 14px;display:flex;flex-direction:column;gap:14px;max-height:88%;overflow:hidden}
.dialog .dacts{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:4px 6px;margin-top:4px}
.dialog .dic{color:var(--secondary);align-self:center}
.dialog.danger .dic{color:var(--error)}
.snack{position:absolute;left:12px;right:12px;z-index:7;background:var(--inverseSurface);color:var(--onInverseSurface);border-radius:10px;padding:6px 6px 6px 16px;min-height:48px;display:flex;align-items:center;gap:8px;font-size:calc(var(--ts)*14px);line-height:1.35;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.snack .btn{color:var(--inversePrimary);padding:10px 12px}
.toastcard{position:absolute;left:12px;right:12px;z-index:7}
/* banners & notices */
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 12px 12px 14px;border-radius:14px;font-size:calc(var(--ts)*14px);line-height:1.4}
.banner .bt{flex:1;min-width:0}
.banner.info{background:var(--infoContainer);color:var(--onInfoContainer)}
.banner.warn{background:var(--warningContainer);color:var(--onWarningContainer)}
.banner.bad{background:var(--errorContainer);color:var(--onErrorContainer)}
.banner.ok{background:var(--successContainer);color:var(--onSuccessContainer)}
.banner.neutral{background:var(--surfaceContainerHigh);color:var(--onSurface)}
.banner.view{background:var(--tertiaryContainer);color:var(--onTertiaryContainer)}
.banner .bacts{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 -6px -12px}
.banner .bacts .btn{min-height:40px;color:inherit;text-decoration:underline;text-underline-offset:3px}
.note{display:flex;gap:10px;align-items:flex-start;font-size:calc(var(--ts)*13px);line-height:1.45;color:var(--onSurfaceVariant)}
/* ingredients / steps */
.ing{display:flex;align-items:baseline;gap:10px;padding:10px 16px;border-bottom:1px solid var(--outlineVariant);font-size:calc(var(--ts)*16px);line-height:1.45}
.ing .q{font-weight:700;font-variant-numeric:tabular-nums;color:var(--onSurface);white-space:nowrap}
.ing .unsc{display:flex;align-items:center;gap:4px;font-size:calc(var(--ts)*12.5px);color:var(--warning);font-weight:600;margin-top:2px}
.grp{font-family:var(--serif);font-weight:600;font-style:italic;font-size:calc(var(--ts)*15.5px);color:var(--primary);padding:16px 16px 4px}
.step{display:flex;gap:14px;padding:12px 16px;font-size:calc(var(--ts)*16px);line-height:1.55}
.step .n{flex:none;width:30px;height:30px;border-radius:15px;background:var(--surfaceContainerHigh);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--ts)*14px);color:var(--onSurface)}
.tchip{display:inline-flex;align-items:center;gap:4px;padding:1px 9px 1px 6px;border-radius:8px;background:var(--secondaryContainer);color:var(--onSecondaryContainer);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;vertical-align:baseline}
.conv{display:inline-flex;align-items:center;padding:0 5px;margin-left:3px;border-radius:5px;font-size:.72em;font-weight:700;background:var(--tertiaryContainer);color:var(--onTertiaryContainer);vertical-align:2px}
.link{color:var(--primary);text-decoration:underline;text-underline-offset:3px}
/* cook */
.cook{background:var(--cookSurface);color:var(--cookInk)}
.cstep{border-radius:20px;padding:16px 16px 18px;display:flex;gap:14px;background:var(--surfaceContainerLow);box-shadow:inset 0 0 0 1px var(--outlineVariant);font-size:calc(var(--ts)*var(--ck)*24px);line-height:1.42}
.dark .cstep{background:var(--surfaceContainerLow)}
.cstep .n{flex:none;width:44px;height:44px;border-radius:22px;background:var(--surfaceContainerHighest);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--ts)*18px)}
.cstep.cur{background:var(--currentStep);color:var(--onCurrentStep);box-shadow:inset 0 0 0 3px var(--currentStepEdge);font-size:calc(var(--ts)*var(--ck)*28px);font-weight:500}
.cstep.cur .n{background:var(--currentStepEdge);color:var(--cookSurface)}
.cstep.x{color:var(--crossedOff);background:transparent;box-shadow:inset 0 0 0 1px var(--outlineVariant);font-size:calc(var(--ts)*var(--ck)*20px)}
.cstep.x .txt{text-decoration:line-through;text-decoration-thickness:2px}
.cstep.x .n{background:transparent;color:var(--success)}
.now{display:inline-flex;align-items:center;gap:4px;font-size:calc(var(--ts)*13px);font-weight:800;letter-spacing:.8px;text-transform:uppercase;background:var(--currentStepEdge);color:var(--cookSurface);border-radius:6px;padding:2px 8px;margin-bottom:6px}
.ctimer{display:inline-flex;align-items:center;gap:8px;min-height:64px;padding:8px 18px 8px 14px;border-radius:16px;background:var(--timerActive);color:var(--onTimerActive);font-weight:700;font-size:calc(var(--ts)*20px);font-variant-numeric:tabular-nums;margin-top:12px}
.cing{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 16px;border-bottom:1px solid var(--outlineVariant);font-size:calc(var(--ts)*var(--ck)*22px);line-height:1.38}
.cing.x{color:var(--crossedOff)}.cing.x .t{text-decoration:line-through;text-decoration-thickness:2px}
.cing .ck{flex:none;width:34px;height:34px;border-radius:17px;box-shadow:inset 0 0 0 2.5px var(--onSurfaceVariant);display:flex;align-items:center;justify-content:center}
.cing.x .ck{background:var(--success);box-shadow:none;color:var(--onSuccess)}
.tray{display:flex;gap:8px;overflow:hidden}
.tpill{display:flex;align-items:center;gap:8px;min-height:52px;padding:4px 14px 4px 10px;border-radius:16px;background:var(--timerActive);color:var(--onTimerActive);flex:none}
.tpill .tn{font-size:calc(var(--ts)*12px);font-weight:600;line-height:1.2;opacity:.92}
.tpill .tr{font-size:calc(var(--ts)*20px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.runpill{position:absolute;left:50%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:8px;height:44px;padding:0 18px 0 14px;border-radius:22px;background:var(--timerActive);color:var(--onTimerActive);font-weight:700;font-size:calc(var(--ts)*14.5px);font-variant-numeric:tabular-nums;box-shadow:0 3px 10px rgba(0,0,0,.22);white-space:nowrap}
/* status card */
.stat{border-radius:20px;padding:16px;display:flex;gap:14px;align-items:flex-start}
.stat .sic{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;flex:none}
.stat.ok{background:var(--successContainer);color:var(--onSuccessContainer)}.stat.ok .sic{background:var(--success);color:var(--onSuccess)}
.stat.warn{background:var(--warningContainer);color:var(--onWarningContainer)}.stat.warn .sic{background:var(--warning);color:var(--onWarning)}
.stat.bad{background:var(--errorContainer);color:var(--onErrorContainer)}.stat.bad .sic{background:var(--error);color:var(--onError)}
.stat.none{background:var(--surfaceContainerHigh);color:var(--onSurface)}.stat.none .sic{background:var(--outline);color:var(--surface)}
.meter{height:10px;border-radius:5px;background:var(--surfaceContainerHighest);overflow:hidden;box-shadow:inset 0 0 0 1px var(--outlineVariant)}
.meter>i{display:block;height:100%;background:var(--secondary);border-radius:5px}
.prog{height:6px;border-radius:3px;background:var(--surfaceContainerHighest);overflow:hidden}.prog>i{display:block;height:100%;background:var(--primary)}
.stepper{display:flex;align-items:center;border-radius:28px;box-shadow:inset 0 0 0 1px var(--outline);min-height:52px}
.stepper .sv{flex:1;text-align:center;font-weight:700;font-size:calc(var(--ts)*17px);font-variant-numeric:tabular-nums;padding:4px}
.handle{color:var(--onSurfaceVariant)}
.osph{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:repeating-linear-gradient(135deg,#9a9a9a 0 12px,#a8a8a8 12px 24px);color:#222;font:600 14px/1.4 var(--sans);text-align:center;padding:24px}
.osph b{background:#eee;padding:8px 12px;border-radius:8px}
.webpage{background:#fff;color:#222;font-family:Georgia,serif}
.sel-hl{background:rgba(66,133,244,.32)}
.picked{box-shadow:inset 3px 0 0 #2B5C86;background:rgba(43,92,134,.08)}
.role{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:calc(var(--ts)*12px);font-weight:700;flex:none}
.r-name{background:var(--primaryContainer);color:var(--onPrimaryContainer)}
.r-ing{background:var(--secondaryContainer);color:var(--onSecondaryContainer)}
.r-step{background:var(--tertiaryContainer);color:var(--onTertiaryContainer)}
.r-head{background:var(--surfaceContainerHighest);color:var(--onSurface)}
.r-note{background:var(--infoContainer);color:var(--onInfoContainer)}
.r-ign{background:transparent;color:var(--onSurfaceVariant);box-shadow:inset 0 0 0 1px var(--outline);text-decoration:line-through}
.focusring{outline:2px solid var(--primary);outline-offset:2px}

html{background:#0f0d0b}body{background:transparent;padding:32px;display:flex;gap:32px;align-items:flex-start}
.frame-notes{max-width:340px;font:13px/1.55 'Noto Sans',sans-serif;color:#e9e0d3}.frame-notes p{margin:0 0 6px}
.dev{border-radius:28px;box-shadow:0 0 0 10px #111,0 20px 50px rgba(0,0,0,.3)}</style></head>
