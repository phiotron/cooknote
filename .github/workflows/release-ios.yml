# Phát hành iOS: archive bản Release đã ký → .ipa → tải lên App Store Connect (TestFlight).
# CHỈ chạy tay. CHƯA KIỂM CHỨNG (2026-11-05): chưa có tài khoản Apple Developer.
#
# Ký TỰ ĐỘNG bằng App Store Connect API key (-allowProvisioningUpdates): Xcode tự tạo/tải chứng chỉ
# và provisioning profile cho CẢ app lẫn Share Extension (hai bundle id, cùng App Group) — không cần
# Mac, không cần xuất .p12. Secrets do Phương tự tạo theo docs/ci.md:
#   IOS_TEAM_ID          Team ID 10 ký tự (developer.apple.com › Membership details)
#   ASC_KEY_ID           Key ID của App Store Connect API key (Users and Access › Integrations), vai trò Admin
#   ASC_ISSUER_ID        Issuer ID hiện phía trên danh sách key
#   ASC_KEY_P8_BASE64    file AuthKey_<KEY_ID>.p8 mã hoá base64
# Trước lần chạy đầu: đăng ký App ID com.phiotron.cooknote + com.phiotron.cooknote.ShareExtension,
# App Group group.com.phiotron.cooknote, và tạo app "CookNote" trên App Store Connect (docs/ci.md).
name: Release iOS

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Phiên bản hiển thị (để trống = lấy từ pubspec.yaml)'
        required: false
        default: ''
      upload:
        description: 'Tải lên App Store Connect / TestFlight'
        type: boolean
        default: true

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  release:
    name: Archive ký + TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_PATH: ${{ github.workspace }}/../asc/AuthKey.p8
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm đủ secrets
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=0
          for v in IOS_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!v}" ]; then echo "::error::Thiếu secret $v (docs/ci.md)"; missing=1; fi
          done
          exit $missing

      - name: Kiểm phiên bản Xcode ≥ 26 (S-20)
        run: |
          xcodebuild -version
          major=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          if [ "$major" -lt 26 ]; then echo "::error::Cần Xcode 26 trở lên, đang có $major"; exit 1; fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Ghi API key tạm
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$(dirname "$ASC_KEY_PATH")" "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$ASC_KEY_PATH"
          cp "$ASC_KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Chuẩn bị cấu hình Flutter (số build = số lần chạy)
        env:
          BUILD_NAME: ${{ inputs.build_name }}
        run: |
          flutter pub get
          ARGS="--release --config-only --build-number=${{ github.run_number }}"
          if [ -n "$BUILD_NAME" ]; then ARGS="$ARGS --build-name=$BUILD_NAME"; fi
          flutter build ios $ARGS
          # flutter_tts còn dùng CocoaPods (docs/ci.md); chạy lại cho chắc workspace có Pods.
          (cd ios && pod install)

      - name: Archive (ký tự động bằng API key)
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          mkdir -p ci-logs
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/ios/Runner.xcarchive archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" CODE_SIGN_STYLE=Automatic 2>&1 | tee ci-logs/archive.log

      - name: Xuất .ipa (App Store Connect)
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/ios/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee ci-logs/export.log
          ls -la build/ios/ipa

      - name: Kiểm .ipa (PrivacyInfo, Share Extension, app group)
        run: |
          IPA=$(ls build/ios/ipa/*.ipa | head -n1)
          rm -rf "$RUNNER_TEMP/ipa" && mkdir "$RUNNER_TEMP/ipa" && unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
          APP="$RUNNER_TEMP/ipa/Payload/Runner.app"
          test -f "$APP/PrivacyInfo.xcprivacy"
          test -f "$APP/PlugIns/ShareExtension.appex/PrivacyInfo.xcprivacy"
          codesign -d --entitlements - "$APP" 2>&1 | tee ci-logs/entitlements-app.txt
          codesign -d --entitlements - "$APP/PlugIns/ShareExtension.appex" 2>&1 | tee ci-logs/entitlements-extension.txt
          grep -q "group.com.phiotron.cooknote" ci-logs/entitlements-app.txt
          grep -q "group.com.phiotron.cooknote" ci-logs/entitlements-extension.txt

      - name: Tải lên App Store Connect (TestFlight)
        if: inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(ls build/ios/ipa/*.ipa | head -n1)
          xcrun altool --validate-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Lưu .ipa + log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-${{ github.run_number }}
          path: |
            build/ios/ipa/*.ipa
            ci-logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Dọn khoá API
        if: always()
        run: rm -rf "$(dirname "$ASC_KEY_PATH")" "$HOME/.appstoreconnect/private_keys"
